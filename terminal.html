<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>261hz // terminal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #00cc44; --green-dim: #005520; --green-brt: #00ff88;
    --green-pale: #003311; --bg: #050a05; --cursor: #00ff55;
  }
  html, body { height: 100%; background: var(--bg); color: var(--green);
    font-family: "Courier New", Courier, monospace; font-size: 18px;
    line-height: 1.6; overflow: hidden; }
  body::before { content: ""; position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
    pointer-events: none; z-index: 100; }
  body::after { content: ""; position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.55) 100%);
    pointer-events: none; z-index: 101; }
  #terminal { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 1.5rem 2rem; overflow: hidden; }
  #output { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  #output::-webkit-scrollbar { display: none; }
  .line { min-height: 1.6em; word-break: break-word; white-space: pre-wrap; }
  .line-dim { color: var(--green-dim); }
  .line-brt { color: var(--green-brt); }
  .line-warn { color: #886600; }
  .line-empty { min-height: 0.8em; }
  .line-cmd { color: var(--green); }
  #input-row { display: flex; align-items: center; margin-top: 0.3rem; flex-shrink: 0; }
  #prompt { color: var(--green); margin-right: 0.5rem; flex-shrink: 0; white-space: nowrap; }
  #input { background: transparent; border: none; outline: none; color: var(--green);
    font-family: inherit; font-size: inherit; flex: 1; caret-color: var(--cursor); }
  #snake-container { display: none; position: fixed; inset: 0; background: var(--bg);
    flex-direction: column; align-items: center; justify-content: center; z-index: 300; }
  #snake-container.visible { display: flex; }
  #snake-canvas { border: 1px solid var(--green-pale); image-rendering: pixelated; }
  .game-label { color: var(--green-dim); font-size: 14px; margin: 0.5rem; letter-spacing: 2px; }
  #t2048-container { display: none; position: fixed; inset: 0; background: var(--bg);
    flex-direction: column; align-items: center; justify-content: center; z-index: 300; gap: 1rem; }
  #t2048-container.visible { display: flex; }
  #t2048-grid { display: grid; grid-template-columns: repeat(4, 70px); grid-template-rows: repeat(4, 70px); gap: 4px; }
  .t2048-cell { width: 70px; height: 70px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: bold; border: 1px solid var(--green-pale); color: var(--green); background: var(--bg); }
  .t2048-cell[data-val="8"]  { background: #001a00; }
  .t2048-cell[data-val="16"] { background: #002200; color: #00ff77; }
  .t2048-cell[data-val="32"] { background: #003300; color: #00ffaa; }
  .t2048-cell[data-val="64"] { background: #004400; color: #00ffcc; }
  .t2048-cell[data-val="128"] { background: #005500; color: #00ffee; font-size:16px; }
  .t2048-cell[data-val="256"] { background: #006600; color: #00ffff; font-size:16px; }
  .t2048-cell[data-val="512"] { background: #007700; color: #44ffff; font-size:14px; }
  .t2048-cell[data-val="1024"] { background: #008800; color: #88ffff; font-size:12px; }
  .t2048-cell[data-val="2048"] { background: #009900; color: #ccffff; font-size:11px; }
  #t2048-score { color: var(--green-dim); font-size: 14px; letter-spacing: 2px; }
  #t2048-msg { color: var(--green-brt); font-size: 14px; letter-spacing: 2px; min-height: 1.4em; }
</style>
</head>
<body>
<div id="terminal">
  <div id="output"></div>
  <div id="input-row">
    <span id="prompt">visitor@261hz:~$&nbsp;</span>
    <input id="input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus />
  </div>
</div>
<div id="snake-container">
  <div class="game-label">SNAKE &mdash; arrows to move &mdash; q to quit</div>
  <canvas id="snake-canvas" width="400" height="400"></canvas>
  <div class="game-label" id="snake-score">score: 0</div>
</div>
<div id="t2048-container">
  <div class="game-label">2048 &mdash; arrow keys &mdash; q to quit</div>
  <div id="t2048-score">score: 0</div>
  <div id="t2048-grid"></div>
  <div id="t2048-msg"></div>
</div>
<audio id="composition" preload="auto"><source src="composition.m4a" type="audio/mp4"></audio>
<script>
const PROFILE_URL = "https://github.com/261Hz";
const GAME_URL = "game.html";
 
const fs = {
  "~": { type:"dir", children:["compositions/","recordings/","notes/","influences.txt","practice_log.txt","_untitled_003.txt",".hidden/"] },
  "~/compositions": { type:"dir", children:["composition_01.mid","variations_unfinished.mid","nocturne_fragment.mid","theme_in_c.mid"] },
  "~/recordings": { type:"dir", children:["rec_001.wav","rec_002.wav","rec_003.wav","rec_004.wav"] },
  "~/notes": { type:"dir", children:["harmony_notes.txt","voice_leading.txt","fragments.txt"] },
  "~/.hidden": { type:"dir", children:["261","system.log","do_not_open.txt"] },
  "~/influences.txt": { type:"file", content:"sergei rachmaninoff\nerik satie\nalexander scriabin\nfrederic chopin\nludwig van beethoven (late period)\n[REDACTED]\n[REDACTED]\n[REDACTED]\n\nnote to self: stop trying to sound like them.\nstart trying to sound like whatever this is." },
  "~/practice_log.txt": { type:"file", content:"jan 03 — 3h. vocalise. cant get the phrasing right.\njan 07 — 4h. scriabin etudes. hands hurt.\njan 12 — 2h. own composition. something is there.\njan 19 — 5h. own composition. its almost something.\njan 24 — 1h. couldnt focus.\njan 31 — 6h. i think i found it.\nfeb 04 — 3h.\nfeb 09 — 2h.\nfeb 14 —\nfeb 21 —\nmar 02 —" },
  "~/_untitled_003.txt": { type:"file", content:"The Masquerade of Shadows\n\nWandering aimlessly. Searching, not even knowing what it is I seek.\nWrithing in gleeful agony, in my own fetid feces.\nMy mawkish chagrin laughs at me as I twirl about seeking—\nparading about in my little show of piety.\nWhen beneath that mask lies a monster so cold and heartless\nthat I have been abandoned by Satan himself to do as I please.\nPleading to sleep in peace—but if I sleep, I sleep evermore,\nas the shadows I have sown darken eternity.\n\nWhat I have failed to consider\nis that not all monsters are evil...\n\nHow we long for time to pass not realizing—or caring(?)—\nthat it is our own life. Boredom seems to be a powerful innate\nreaction to thirst for knowledge, stimulation, etc.—\nyet greatly misunderstood and not utilized...\n\nmy ramblings" },
  "~/notes/harmony_notes.txt": { type:"file", content:"minor 9ths feel like unresolved grief.\naugmented chords — instability, yearning.\nthe tritone does not resolve. let it not resolve.\nsilence is a note. the longest one.\n261.63 hz — middle c — the origin point.\neverything is a variation on this." },
  "~/notes/voice_leading.txt": { type:"file", content:"do not move voices you do not have to move.\ncontrary motion feels like argument.\nparallel motion feels like acceptance.\nthe melody should breathe.\nif it does not breathe it is not alive yet." },
  "~/notes/fragments.txt": { type:"file", content:"— a theme that returns but changed\n— something that sounds like memory\n— the feeling of a room after someone leaves\n— [corrupted]\n— [corrupted]\n— the last note should not resolve" },
  "~/compositions/composition_01.mid": { type:"file", isMidi:true, content:"4d546864 00000006 00010002 00c04d54 726b0000\n00144d54 726b0000 00147800 00904800 7878004e\n[file continues — 2,847 bytes]\n[integrity: uncertain]" },
  "~/compositions/variations_unfinished.mid": { type:"file", isMidi:true, content:"4d546864 00000006 00010002 00c04d54 726b0000\n[corrupted at byte 0x4a2]\n[recovery failed]\n[integrity: compromised]" },
  "~/compositions/nocturne_fragment.mid": { type:"file", isMidi:true, content:"[empty]\n[file exists but contains nothing]\n[or nothing that can be read here]" },
  "~/compositions/theme_in_c.mid": { type:"file", isMidi:true, content:"4d546864 00000006 00010001 00c0\n[note: key of c. middle c. 261.63 hz]\n[file truncated]" },
  "~/recordings/rec_001.wav": { type:"file", isAudio:true, content:"RIFF....WAVEfmt [corrupted]\n[playback failed]\n[static]" },
  "~/recordings/rec_002.wav": { type:"file", isAudio:true, content:"RIFF....WAVEfmt [corrupted]\n[playback failed]\n[static]" },
  "~/recordings/rec_003.wav": { type:"file", isAudio:true, content:"RIFF....WAVEfmt [corrupted]\n[playback failed]\n[static]" },
  "~/recordings/rec_004.wav": { type:"file", isAudio:true, content:"RIFF....WAVEfmt\n[this one almost plays]\n[you can almost hear it]\n[then nothing]" },
  "~/.hidden/system.log": { type:"file", content:"[2025-01-03 03:14:22] boot sequence initiated\n[2025-01-03 03:14:23] identity module: loaded\n[2025-01-03 03:14:23] memory: fragmented\n[2025-01-24 11:33:01] anomaly detected in sector 261\n[2025-01-24 11:33:01] anomaly: unresolved\n[2025-02-14 00:00:00] last activity recorded\n[2025-02-14 00:00:01] ...\n[2025-02-14 00:00:01] ...\n[timestamp corrupted]" },
  "~/.hidden/do_not_open.txt": { type:"file", content:"you opened it anyway.\n\ngood." },
  "~/.hidden/261": { type:"file", isPortal:true, content:"[executable]\n[run: ./261 or type: 261]" }
};
 
let cwd = "~";
let cmdHistory = [];
let histIdx = -1;
let audioPlaying = false;
const audio = document.getElementById("composition");
 
const out = () => document.getElementById("output");
 
function print(text, cls="line") {
  const div = document.createElement("div");
  div.className = cls; div.textContent = text;
  out().appendChild(div); out().scrollTop = out().scrollHeight;
}
function printEmpty() { print("", "line line-empty"); }
function printDim(t)  { print(t, "line line-dim"); }
function printBrt(t)  { print(t, "line line-brt"); }
function printWarn(t) { print(t, "line line-warn"); }
function printLines(text, cls) { text.split("\n").forEach(l => print(l, cls||"line line-dim")); }
 
function resolvePath(p) {
  if (!p || p === "~") return "~";
  if (p.startsWith("~/") || p === "~") return p;
  if (p === "..") { if (cwd === "~") return "~"; return cwd.substring(0, cwd.lastIndexOf("/")) || "~"; }
  if (p === ".") return cwd;
  return (cwd === "~" ? "~" : cwd) + "/" + p.replace(/\/$/, "");
}
 
function playComposition() {
  if (audioPlaying) return;
  audioPlaying = true;
  audio.volume = 0.4;
  audio.play().catch(() => {});
  audio.onended = () => { audioPlaying = false; };
}
 
function handleCommand(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return;
  cmdHistory.unshift(trimmed); histIdx = -1;
  print("visitor@261hz:" + cwd + "$ " + trimmed, "line line-cmd");
  const parts = trimmed.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const args = parts.slice(1);
 
  switch(cmd) {
    case "help":
      printEmpty();
      printDim("available commands:");
      printDim("  ls [dir]        — list directory");
      printDim("  cd [dir]        — change directory");
      printDim("  cat [file]      — read file");
      printDim("  pwd             — current directory");
      printDim("  whoami          — identify yourself");
      printDim("  ps              — running processes");
      printDim("  top             — system monitor");
      printDim("  history         — command history");
      printDim("  ping [host]     — ping");
      printDim("  fortune         — fortune");
      printDim("  man [cmd]       — manual");
      printDim("  snake           — play snake");
      printDim("  2048            — play 2048");
      printDim("  clear           — clear screen");
      printDim("  exit            — disconnect");
      printEmpty();
      break;
 
    case "pwd":
      printEmpty(); print(cwd.replace("~", "/home/261")); printEmpty(); break;
 
    case "whoami":
      printEmpty(); printWarn("visitor"); printDim("you should not be here."); printEmpty(); break;
 
    case "ls": {
      printEmpty();
      const target = args[0] ? resolvePath(args[0]) : cwd;
      const dir = fs[target] || fs[target.replace(/\/$/, "")];
      if (!dir || dir.type !== "dir") { printWarn("ls: " + (args[0]||cwd) + ": no such directory"); }
      else {
        const showHidden = args.some(a => a.startsWith("-") && a.includes("a"));
        dir.children.forEach(child => {
          if (!child.startsWith(".") || showHidden) {
            print(child, child.endsWith("/") ? "line line-brt" : "line");
          }
        });
      }
      printEmpty(); break;
    }
 
    case "cd": {
      if (!args[0] || args[0] === "~") { cwd = "~"; break; }
      const target = resolvePath(args[0]);
      const dir = fs[target] || fs[target.replace(/\/$/, "")];
      if (!dir || dir.type !== "dir") { printWarn("cd: " + args[0] + ": no such directory"); }
      else { cwd = target.replace(/\/$/, ""); }
      break;
    }
 
    case "cat": {
      if (!args[0]) { printWarn("cat: missing operand"); break; }
      printEmpty();
      const target = resolvePath(args[0]);
      const file = fs[target] || fs[cwd + "/" + args[0]];
      if (!file) { printWarn("cat: " + args[0] + ": no such file"); }
      else if (file.type === "dir") { printWarn("cat: " + args[0] + ": is a directory"); }
      else {
        if (file.isMidi) playComposition();
        printLines(file.content, file.isPortal ? "line line-brt" : "line line-dim");
      }
      printEmpty(); break;
    }
 
    case "ps":
      printEmpty();
      printDim("  PID  COMMAND");
      printDim("    1  init");
      printDim("   42  memory_manager [fragmented]");
      printDim("  261  [unknown process]");
      printDim("  314  audio_daemon [sleeping]");
      printDim("  404  identity [not found]");
      printDim("  666  shadow_process [cannot be killed]");
      printDim(" 1000  bash");
      printEmpty(); break;
 
    case "top":
      printEmpty();
      printDim("system monitor — 261hz");
      printDim("─────────────────────────────────");
      printDim("cpu:  ████████░░░░░░░░  49%");
      printDim("mem:  ██████████████░░  87% [fragmented]");
      printDim("disk: ████░░░░░░░░░░░░  23%");
      printEmpty();
      printDim("top processes:");
      printDim("  [unknown]        cpu: 26%  mem: 41%");
      printDim("  audio_daemon     cpu: 12%  mem: 18%  [sleeping]");
      printDim("  shadow_process   cpu:  9%  mem: 12%  [unkillable]");
      printDim("  memory_manager   cpu:  2%  mem: 16%  [fragmented]");
      printEmpty(); break;
 
    case "history": {
      printEmpty();
      const fake = ["ssh user@261hz.net","cd compositions","ls","cat composition_01.mid",
        "play composition_01.mid","cd ..","cat _untitled_003.txt","rm _untitled_003.txt",
        "cat _untitled_003.txt","[command not found]","cd .hidden","ls -a",
        "cat do_not_open.txt","./261"];
      fake.forEach((h,i) => printDim("  " + String(i+1).padStart(3) + "  " + h));
      cmdHistory.slice().reverse().forEach((h,i) =>
        printDim("  " + String(fake.length+i+1).padStart(3) + "  " + h));
      printEmpty(); break;
    }
 
    case "clear": document.getElementById("output").innerHTML = ""; break;
 
    case "sudo": printEmpty(); printWarn("nice try."); printEmpty(); break;
 
    case "ssh":
      printEmpty(); printDim("connecting to " + (args[0]||"261hz.net") + "...");
      setTimeout(() => printDim("connection established."), 600);
      setTimeout(() => printDim("identity: [REDACTED]"), 1200);
      setTimeout(() => printDim("session: already in progress."), 1800);
      setTimeout(() => { printDim("you are already inside."); printEmpty(); }, 2400);
      break;
 
    case "ping": {
      printEmpty();
      const host = args[0]||"261hz.net";
      printDim("PING " + host);
      [400,800,1200].forEach(t => setTimeout(() =>
        printDim("64 bytes from " + host + ": icmp_seq=" + (t/400) + " ttl=54 time=261.63 ms"), t));
      setTimeout(() => { printDim("--- " + host + " ping statistics ---");
        printDim("3 packets transmitted, 3 received, 0% loss"); printEmpty(); }, 1600);
      break;
    }
 
    case "joshua":
      printEmpty(); printBrt("GREETINGS PROFESSOR FALKEN.");
      setTimeout(() => printEmpty(), 600);
      setTimeout(() => printDim("SHALL WE PLAY A GAME?"), 1200);
      setTimeout(() => printEmpty(), 1800);
      setTimeout(() => printDim("1. chess"), 2200);
      setTimeout(() => printDim("2. global thermonuclear war"), 2600);
      setTimeout(() => printDim("3. snake"), 3000);
      setTimeout(() => printEmpty(), 3400);
      setTimeout(() => printDim("a strange game."), 4200);
      setTimeout(() => printDim("the only winning move is not to play."), 4800);
      setTimeout(() => { printDim("how about a nice game of snake?"); printEmpty(); }, 5400);
      break;
 
    case "thermonuclear":
      printEmpty(); printBrt("WOULD NOT YOU PREFER A GOOD GAME OF CHESS?");
      setTimeout(() => printEmpty(), 600);
      setTimeout(() => printDim("..."), 1200);
      setTimeout(() => printDim("a strange game."), 2000);
      setTimeout(() => { printDim("the only winning move is not to play."); printEmpty(); }, 2800);
      break;
 
    case "snake": startSnake(); break;
    case "2048": start2048(); break;
 
    case "261":
    case "./261":
      printEmpty(); printDim("loading...");
      setTimeout(() => { window.location.href = GAME_URL; }, 1200);
      break;
 
    case "play":
      if (args[0] && args[0].includes(".mid")) {
        printEmpty(); printDim("attempting playback...");
        playComposition();
        setTimeout(() => { printDim("[audio plays — or something like it]"); printEmpty(); }, 800);
      } else { printEmpty(); printWarn("specify a file. try: play composition_01.mid"); printEmpty(); }
      break;
 
    case "stop":
      audio.pause(); audio.currentTime = 0; audioPlaying = false;
      printEmpty(); printDim("stopped."); printEmpty(); break;
 
    case "fortune": {
      printEmpty();
      const f = ["the note that does not resolve is the most honest.",
        "memory is just corruption with better PR.",
        "all music is a variation on silence.",
        "the maze does not have an exit. only a center.",
        "boredom is thirst wearing the wrong name.",
        "beneath every mask: something that did not ask to be hidden.",
        "261.63 hz. the origin point. everything returns here."];
      printDim(f[Math.floor(Math.random()*f.length)]); printEmpty(); break;
    }
 
    case "man":
      printEmpty();
      if (args[0] === "love") {
        printDim("LOVE(1)                   user commands                   LOVE(1)");
        printEmpty(); printDim("NAME"); printDim("       love — undefined behavior");
        printEmpty(); printDim("SYNOPSIS"); printDim("       love [--unconditional] [--reciprocated?]");
        printEmpty(); printDim("DESCRIPTION"); printDim("       love has no man page.");
        printDim("       some things resist documentation."); printEmpty();
      } else { printDim("no manual entry for " + (args[0]||"(nothing)")); printDim("some things resist documentation."); printEmpty(); }
      break;
 
    case "uname": printEmpty(); printDim("261hz 2.1.0 #1 SMP [unknown architecture]"); printEmpty(); break;
 
    case "vi": case "vim": case "nano":
      printEmpty(); printDim("you open " + cmd + ".");
      setTimeout(() => printDim("you cannot leave."), 800);
      setTimeout(() => { printDim("(just kidding. type :q or q)"); printEmpty(); }, 1600);
      break;
 
    case "exit": case "logout":
      printEmpty(); printDim("session terminated."); printDim("you were never here.");
      setTimeout(() => { document.body.style.transition = "opacity 2s ease"; document.body.style.opacity = "0"; }, 1000);
      setTimeout(() => { window.location.href = PROFILE_URL; }, 3000);
      break;
 
    default:
      printEmpty(); printWarn(cmd + ": command not found");
      printDim("type help for available commands"); printEmpty(); break;
  }
}
 
// SNAKE
function startSnake() {
  const container = document.getElementById("snake-container");
  container.classList.add("visible");
  document.getElementById("input").blur();
  const canvas = document.getElementById("snake-canvas");
  const ctx = canvas.getContext("2d");
  const CELL = 20, W = canvas.width/CELL, H = canvas.height/CELL;
  let snake = [{x:10,y:10}], dir = {x:1,y:0}, nextDir = {x:1,y:0};
  let food = {x:Math.floor(Math.random()*W), y:Math.floor(Math.random()*H)};
  let score = 0, running = true;
 
  function draw() {
    ctx.fillStyle = "#050a05"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#00ff88"; ctx.fillRect(food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4);
    snake.forEach((s,i) => { ctx.fillStyle = i===0 ? "#00ff55" : "#00cc44"; ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2); });
  }
 
  const iv = setInterval(() => {
    dir = nextDir;
    const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if (head.x<0||head.x>=W||head.y<0||head.y>=H||snake.some(s=>s.x===head.x&&s.y===head.y)) {
      running = false; clearInterval(iv);
      ctx.fillStyle = "rgba(5,10,5,0.7)"; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#00ff88"; ctx.font = "20px Courier New"; ctx.textAlign = "center";
      ctx.fillText("game over — score: "+score, canvas.width/2, canvas.height/2);
      ctx.fillStyle = "#005520"; ctx.font = "14px Courier New";
      ctx.fillText("press q to return", canvas.width/2, canvas.height/2+30);
      return;
    }
    snake.unshift(head);
    if (head.x===food.x&&head.y===food.y) {
      score++; document.getElementById("snake-score").textContent = "score: "+score;
      food = {x:Math.floor(Math.random()*W), y:Math.floor(Math.random()*H)};
    } else { snake.pop(); }
    draw();
  }, 120);
  draw();
 
  function kh(e) {
    if (e.key==="q") { clearInterval(iv); container.classList.remove("visible"); document.removeEventListener("keydown",kh); document.getElementById("input").focus(); return; }
    const d = {ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
    if (d[e.key]&&!(d[e.key].x===-dir.x&&d[e.key].y===-dir.y)) { nextDir=d[e.key]; e.preventDefault(); }
  }
  document.addEventListener("keydown", kh);
}
 
// 2048
function start2048() {
  const container = document.getElementById("t2048-container");
  container.classList.add("visible");
  document.getElementById("input").blur();
  let board = Array(4).fill(null).map(()=>Array(4).fill(0)), score = 0;
 
  function addRandom() {
    const empty = []; board.forEach((r,ri)=>r.forEach((v,ci)=>{if(!v)empty.push([ri,ci]);}));
    if (!empty.length) return;
    const [r,c] = empty[Math.floor(Math.random()*empty.length)];
    board[r][c] = Math.random()<0.9?2:4;
  }
  function render() {
    const grid = document.getElementById("t2048-grid"); grid.innerHTML = "";
    board.forEach(row=>row.forEach(val=>{
      const cell = document.createElement("div"); cell.className = "t2048-cell";
      if (val) { cell.textContent = val; cell.dataset.val = val; } grid.appendChild(cell);
    }));
    document.getElementById("t2048-score").textContent = "score: "+score;
  }
  function slide(row) {
    let r = row.filter(v=>v);
    for (let i=0;i<r.length-1;i++) { if(r[i]===r[i+1]){r[i]*=2;score+=r[i];r.splice(i+1,1);} }
    while(r.length<4)r.push(0); return r;
  }
  function move(dir) {
    const prev = JSON.stringify(board);
    if (dir==="left") board=board.map(r=>slide(r));
    if (dir==="right") board=board.map(r=>slide([...r].reverse()).reverse());
    if (dir==="up") { for(let c=0;c<4;c++){const col=slide(board.map(r=>r[c]));board.forEach((r,i)=>r[c]=col[i]);} }
    if (dir==="down") { for(let c=0;c<4;c++){const col=slide(board.map(r=>r[c]).reverse()).reverse();board.forEach((r,i)=>r[c]=col[i]);} }
    if (JSON.stringify(board)!==prev) addRandom();
    render();
    if (board.some(r=>r.includes(2048))) document.getElementById("t2048-msg").textContent = "2048. you found it.";
    const ok = board.some((r,ri)=>r.some((v,ci)=>!v||(ci<3&&board[ri][ci+1]===v)||(ri<3&&board[ri+1][ci]===v)));
    if (!ok) document.getElementById("t2048-msg").textContent = "no moves. game over.";
  }
  addRandom(); addRandom(); render();
 
  function kh(e) {
    if (e.key==="q") { container.classList.remove("visible"); document.removeEventListener("keydown",kh); document.getElementById("input").focus(); return; }
    const m = {ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"};
    if (m[e.key]) { move(m[e.key]); e.preventDefault(); }
  }
  document.addEventListener("keydown", kh);
}
 
// INPUT
const input = document.getElementById("input");
input.addEventListener("keydown", function(e) {
  if (e.key==="Enter") { const v=this.value; this.value=""; handleCommand(v); }
  if (e.key==="ArrowUp") { e.preventDefault(); if(histIdx<cmdHistory.length-1){histIdx++;this.value=cmdHistory[histIdx];} }
  if (e.key==="ArrowDown") { e.preventDefault(); if(histIdx>0){histIdx--;this.value=cmdHistory[histIdx];}else{histIdx=-1;this.value="";} }
});
document.addEventListener("click", () => input.focus());

}
