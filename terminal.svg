<svg width="680" height="300" viewBox="0 0 680 300"
  xmlns="http://www.w3.org/2000/svg"
  role="img">
  <title>80s terminal — GitHub profile</title>
  <desc>An animated CRT terminal showing a typed introduction</desc>
 
  <defs>
    <style>
      .ln {
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
        fill: #00cc44;
      }
      .ln-dim { fill: #005520; }
      .ln-brt { fill: #00ff88; }
 
      .scanline {
        fill: none;
        stroke: rgba(0,0,0,0.12);
        stroke-width: 1;
      }
 
      .t1  { animation: reveal 0s 0.2s both; }
      .t2  { animation: reveal 0s 0.7s both; }
      .t3  { animation: reveal 0s 1.3s both; }
      .t4  { animation: reveal 0s 2.0s both; }
      .t5  { animation: reveal 0s 2.8s both; }
      .t6  { animation: reveal 0s 3.5s both; }
      .t7  { animation: reveal 0s 4.4s both; }
      .t8  { animation: reveal 0s 5.1s both; }
      .t9  { animation: reveal 0s 5.9s both; }
      .t10 { animation: reveal 0s 6.7s both; }
      .t11 { animation: reveal 0s 7.5s both; }
 
      @keyframes reveal {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
 
      .cursor {
        fill: #00ff55;
        opacity: 0;
        animation: cursorshow 0s 7.5s forwards;
      }
 
      @keyframes cursorshow {
        from { opacity: 0; }
        to   { opacity: 1; animation-name: blink; animation-duration: 1s; animation-iteration-count: infinite; animation-timing-function: step-end; }
      }
 
      .blink {
        fill: #00ff55;
        animation: blink 1s step-end 200 7.5s;
      }
 
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }
    </style>
  </defs>
 
  <rect width="680" height="300" rx="4" fill="#050a05"/>
 
  <line x1="0" y1="4"   x2="680" y2="4"   class="scanline"/>
  <line x1="0" y1="8"   x2="680" y2="8"   class="scanline"/>
  <line x1="0" y1="12"  x2="680" y2="12"  class="scanline"/>
  <line x1="0" y1="16"  x2="680" y2="16"  class="scanline"/>
  <line x1="0" y1="20"  x2="680" y2="20"  class="scanline"/>
  <line x1="0" y1="24"  x2="680" y2="24"  class="scanline"/>
  <line x1="0" y1="28"  x2="680" y2="28"  class="scanline"/>
