<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #00cc44;

    --green-brt: #00ff88;
    --green-pale: #003311;
    --bg: #050a05;
    --cursor: #00ff55;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--green);
    font-family: 'Courier New', Courier, monospace;
    font-size: 20px;
    line-height: 1.5;
    overflow: hidden;
    transition: filter 2s ease;
  }

  body.deep { filter: brightness(1.04); }
  body.deep .line {
    text-shadow: 0 0 2px #00ff88, 0 0 8px rgba(0,255,100,0.1);
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px
    );
    pointer-events: none; z-index: 100;
    transition: opacity 2s ease;
  }
  body.deep::before { opacity: 1.4; }

  body::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none; z-index: 101;
  }

  #screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding: 2rem 2.5rem; overflow: hidden;
  }

  #header {
    color: var(--green-dim);
    border-bottom: 1px solid var(--green-pale);
    padding-bottom: 0.5rem; margin-bottom: 1rem;
    font-size: 16px; letter-spacing: 2px;
    display: flex; justify-content: space-between; align-items: center;
  }

  #output {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none; display: flex; flex-direction: column;
  }
  #output::-webkit-scrollbar { display: none; }

  .line       { min-height: 1.5em; word-break: break-word; }
  .line-dim   { color: var(--green-dim); }
  .line-brt   { color: var(--green-brt); }
  .line-cmd   { color: var(--green); }
  .line-empty { min-height: 1em; }
  .line-warn  { color: #886600; }

  #input-row {
    display: flex; align-items: center;
    margin-top: 0.5rem; padding-top: 0.5rem;
    border-top: 1px solid var(--green-pale);
  }
  #prompt { color: var(--green); margin-right: 0.5rem; flex-shrink: 0; }
  #input {
    background: transparent; border: none; outline: none;
    color: var(--green); font-family: inherit; font-size: inherit;
    flex: 1; caret-color: var(--cursor);
  }

  #depth-bar { display: flex; gap: 4px; align-items: center; }
  .depth-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green-pale); transition: background 0.4s;
  }
  .depth-dot.active { background: var(--green-brt); }

  #win-screen {
    display: none; position: fixed; inset: 0; background: var(--bg);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 1.2rem; padding: 3rem; text-align: center; z-index: 200;
  }
  #win-screen.visible { display: flex; }

  .win-line {
    color: var(--green-brt); font-size: 24px;
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .win-freq { font-size: 64px; letter-spacing: 4px; }
  .win-sub  { color: var(--green-dim); font-size: 18px; }
  .win-unsettling { color: var(--green); font-size: 20px; }
  .win-restart {

    cursor: pointer; border: 1px solid var(--green-pale);
    padding: 0.3rem 1rem; letter-spacing: 2px;
  }

let audioCtx = null, osc1 = null, osc2 = null, gainNode = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0;
    osc1 = audioCtx.createOscillator();
    osc1.frequency.value = 261.63; osc1.type = 'sine';
    osc1.connect(gainNode); osc1.start();
    osc2 = audioCtx.createOscillator();
    osc2.frequency.value = 262.03; osc2.type = 'sine';
    const g2 = audioCtx.createGain(); g2.gain.value = 0.4;
    osc2.connect(g2); g2.connect(gainNode); osc2.start();
    gainNode.connect(audioCtx.destination);
  } catch(e) {}
}

function setVolume(t, d) {
  if (!gainNode) return;
  gainNode.gain.linearRampToValueAtTime(t, audioCtx.currentTime + d);
}
function fadeInAudio(depth) {
  if (!audioCtx) return;
  // volume tracks depth bidirectionally — louder deeper, quieter shallower
  const vols = {0:0, 1:0, 2:0, 3:0.002, 4:0.006, 5:0.015, 6:0.025};
  const vol = vols[depth] !== undefined ? vols[depth] : 0;
  setVolume(vol, 1.8); // faster response than before so movement feels connected
  // oscillator convergence still only kicks in at depth 4+
  if (osc2 && depth >= 4) {
    const det = {4:0.3, 5:0.15, 6:0.05}[depth] || 0.4;
    osc2.frequency.setTargetAtTime(261.63 + det, audioCtx.currentTime, 3.0);
  } else if (osc2 && depth < 4) {
    // reset detune when moving back up
    osc2.frequency.setTargetAtTime(262.03, audioCtx.currentTime, 2.0);
  }
}
function fadeOutAudio() {
  if (!gainNode) return;
  setVolume(0, 1.5);
  if (osc2) osc2.frequency.setTargetAtTime(262.03, audioCtx.currentTime + 2, 1.0);
}
function nudgeAudio() {
  if (!gainNode || !audioCtx) return;
  setVolume(Math.min(gainNode.gain.value + 0.008, 0.04), 1.0);
}

// ============================================================
// MOVEMENT RESOLVER
// At depth >= 3: weighted distortion instead of deterministic exit.
// 70% normal, 20% lateral drift, 8% reversal, 2% displacement.
// Anti-spam: same direction 3+ times in a row triggers loop/stall.
// ============================================================

const opposites = { n:'s', s:'n', e:'w', w:'e' };

function getLateralRooms(room) {
  // rooms reachable in 1 step from any neighbor — creates "drift"
  const candidates = [];
  Object.values(room.exits).forEach(nextId => {
    const next = rooms[nextId];
    if (!next) return;
    Object.values(next.exits).forEach(id => {
      if (id !== room.id && id !== nextId && rooms[id]) candidates.push(id);
    });
  });
  return candidates.length > 0 ? candidates : null;
}

function getDisplacementRoom(room) {
  // thematically adjacent: same depth or ±1, previously visited
  const visited = [...roomsVisited].filter(id => {
    const r = rooms[id];
    return r && Math.abs(r.depth - room.depth) <= 1 && id !== room.id;
  });
  return visited.length > 0 ? visited[Math.floor(Math.random() * visited.length)] : null;
}

function getSpamResponse(room) {
  // 4+ repeats: redirect to a previously visited room, or loop
  const visited = [...roomsVisited].filter(id => id !== room.id && rooms[id] && rooms[id].depth <= room.depth);
  if (visited.length > 0) return visited[Math.floor(Math.random() * visited.length)];
  // fallback: one of current room's exits
  const exits = Object.values(room.exits);
  return exits.length > 0 ? exits[Math.floor(Math.random() * exits.length)] : room.id;
}

function resolveMove(room, dir) {
  const intended = room.exits[dir];
  if (!intended) return null; // wall

  // depths 0-2: fully deterministic, no distortion
  if (room.depth < 3) return intended;

  // anti-spam: same direction repeated
  if (lastDir === dir) {
    repeatCount++;
  } else {
    repeatCount = 0;
  }

  // 4+ same direction: always forced back to previously visited room — no progress possible
  if (repeatCount >= 3) {
    repeatCount = 0;
    const visited = [...roomsVisited].filter(id => id !== room.id && rooms[id] && rooms[id].depth <= room.depth);
    if (visited.length > 0) return visited[Math.floor(Math.random() * visited.length)];
    return Object.values(room.exits)[0] || room.id; // last resort: any exit
  }

  // weighted distortion at depth 3+
  const roll = Math.random();

  if (roll < 0.70) {
    // 70% normal
    return intended;
  } else if (roll < 0.90) {
    // 20% lateral drift
    const laterals = getLateralRooms(room);
    if (laterals) return laterals[Math.floor(Math.random() * laterals.length)];
    return intended;
  } else if (roll < 0.98) {
    // 8% reversal — go opposite direction
    const opp = opposites[dir];
    return room.exits[opp] || intended;
  } else {
    // 2% displacement — jump to visited room at same depth
    const displaced = getDisplacementRoom(room);
    return displaced || intended;
  }
}

function checkNonEuclidean() {
  // deep_hall west → entrance (altered) once threshold visited
  if (thresholdUnlocked && roomsVisited.has('threshold') && !rooms['deep_hall']._collapsed) {
    rooms['deep_hall']._collapsed = true;
    rooms['deep_hall'].exits.w = 'entrance';
    // force entrance to altered description on next visit
    visitCounts['entrance'] = Math.max(visitCounts['entrance'] || 0, 1);
  }
  // winding.n → threshold after 2 visits
  if ((visitCounts['winding'] || 0) >= 2 && !rooms['winding']._mutated) {
    rooms['winding']._mutated = true;
    rooms['winding'].exits.n = 'threshold';
  }
}

function checkHumGeometry() {
  // humming 3x quietly connects side_room north to passage_low
  if (humCount >= 3 && !globalEvents.has('humGeometry')) {
    globalEvents.add('humGeometry');
    rooms['side_room'].exits.n = 'passage_low';
    // no announcement
  }
}

// ============================================================
// ROOM DESCRIPTION
// ============================================================
function getRoomDesc(room) {
  const count = visitCounts[room.id] || 0;
  // gradual erosion — no spike, just slow compression over many visits
  // takes 3 visits to reach version 2, 6 to reach version 3, etc.
  const idx = Math.min(Math.floor(count / 2), room.descs.length - 1);
  return room.descs[idx];
}

function getImpressionLines(room) {
  if (!room.impressions) return [];
  const lines = [];
  Object.keys(room.exits).forEach(dir => {
    if (room.impressions[dir]) lines.push(room.impressions[dir]);
  });
  const uncovered = Object.keys(room.exits).filter(d => !room.impressions[d]);
  if (uncovered.length > 0) lines.push("something else opens, indistinct.");
  return lines;
}

function getMemoryLine(roomId) {
  if (roomId === 'hall_a' && moveCount > 15 && roomsVisited.has('hall_a'))
    return "you've walked this corridor before. or one very much like it.";
  if (roomId === 'threshold' && roomsVisited.has('dead_3'))
    return "you are carrying the sound with you now.";
  if (roomId === 'deep_hall' && roomsVisited.has('loop_b') && roomsVisited.has('loop_a'))
    return "you wonder how many lines it took.";
  if (roomId === 'hollow' && roomsVisited.has('false_center'))
    return "you've been here before. something is different.";
  if (roomId === 'hollow' && roomsVisited.has('center'))
    return "you've heard this before. you came back anyway.";
  return null;
}

// ============================================================
// OUTPUT
// ============================================================
const out = () => document.getElementById('output');
function print(text, cls='line') {
  const div = document.createElement('div');
  div.className = cls; div.textContent = text;
  out().appendChild(div); out().scrollTop = out().scrollHeight;
  return div;
}
function printEmpty()  { print('', 'line line-empty'); }
function printBrt(t)   { print(t, 'line line-brt'); }
function printDim(t)   { print(t, 'line line-dim'); }
function printCmd(t)   { print('> ' + t, 'line line-cmd'); }
function printWarn(t)  { print(t, 'line line-warn'); }

// ============================================================
// DEPTH BAR
// ============================================================
function updateDepth(depth) {
  for (let i = 0; i < 7; i++) {
    const dot = document.getElementById('d' + i);
    if (dot) dot.classList.toggle('active', i <= depth);
  }
  if (depth >= 5) document.body.classList.add('deep');
  resetIdle();
}

// ============================================================
// DESCRIBE ROOM
// ============================================================
function describeRoom(roomId, showExits=true) {
  const room = rooms[roomId];
  if (!room) return;

  recordVisit(roomId);
  printEmpty();

  const desc = getRoomDesc(room);
  desc.forEach(line => {
    if (line === '') printEmpty();
    else if (room.isCenter || room.isFalseCenter) printBrt(line);
    else if (room.dead) printDim(line);
    else print(line);
  });

  // one-time: maze breathing
  if (!globalEvents.has('breathing') && room.depth >= 2 && Math.random() < 0.25) {
    globalEvents.add('breathing');
    printEmpty(); printDim("for a moment, you think the maze is breathing.");
  }

  // gravitational pull near center
  if (room.depth >= 5 && !room.isCenter && !room.isFalseCenter && Math.random() < 0.35) {
    printEmpty(); printDim("without thinking, you move toward it.");
  }

  const memory = getMemoryLine(roomId);
  if (memory) { printEmpty(); printDim(memory); }

  if (showExits && !room.isCenter && !room.isFalseCenter) {
    if (room.depth >= 4) {
      const impressions = getImpressionLines(room);
      if (impressions.length > 0) { printEmpty(); impressions.forEach(l => printDim(l)); }
    } else if (room.depth < 5 || (visitCounts[room.id] || 0) <= 1) {
      printEmpty(); printDim(room.flavor);
    }
  }

  updateDepth(room.depth);
  if (audioCtx && room.depth >= 4) fadeInAudio(room.depth);
  checkNonEuclidean();
  checkHumGeometry();
  checkUnlocks();
}

// ============================================================
// COMMANDS
// ============================================================
function handleCommand(raw) {
  const cmd = raw.trim().toLowerCase();
  if (!cmd) return;

  resetIdle();
  initAudio();

  // typo correction
  if (['lisen','listn','listne'].includes(cmd)) {
    printCmd(raw.trim()); printEmpty(); printDim("listen.");
    setTimeout(() => handleCommand('listen'), 600);
    return;
  }

  printCmd(raw.trim());

  if (gameOver) {
    if (['listen','yes','play','hear'].includes(cmd)) triggerWin();
    else { printEmpty(); printBrt("there is only the sound."); printDim("type: listen"); }
    return;
  }

  // false center
  if (rooms[currentRoom].isFalseCenter) {
    if (cmd === 'listen') {
      printEmpty();
      setTimeout(() => {
        setTimeout(() => {
          rooms['false_center'].exits.s = 'hollow';
          printDim("exit: south");
        }, 2200);
      }, 1800);
    } else if ((cmd === 's' || cmd === 'south') && rooms['false_center'].exits.s) {
      // after false center, hollow north opens to true center
      rooms['hollow'].exits.n = 'center';
      currentRoom = 'hollow'; roomsVisited.add(currentRoom);
      moveCount++; describeRoom(currentRoom);
    } else { printEmpty(); printWarn("the wall is solid."); }
    return;
  }

  const room = rooms[currentRoom];

  switch(true) {

    case cmd === 'help': {
      printEmpty();
      printDim("commands:");
      printDim("  n / s / e / w   — move");
      printDim("  look            — look around");
      printDim("  listen          — listen");
      printDim("  where           — where you are");
      printDim("  map             — how far you've come");
      printDim("  help            — this");
      break;
    }

    case cmd === 'look': { describeRoom(currentRoom); break; }

    case cmd === 'where': {
      printEmpty();
      if (room.isCenter) {
        printDim("depth: center"); printDim("moves: irrelevant"); printDim("rooms seen: enough");
      } else if (moveCount > 25) {
        printDim("depth: you stopped measuring a while ago.");
        printDim("moves: " + moveCount); printDim("rooms seen: all of them.");
      } else {
        printDim("depth: " + room.depth);
        printDim("moves: " + moveCount); printDim("rooms seen: " + roomsVisited.size);
      }
      break;
    }

    case cmd === 'map': {
      printEmpty();
      const total = Object.keys(rooms).filter(k => !rooms[k].isFalseCenter && !k.includes('echo') && !k.includes('block')).length;
      const pct = Math.round((roomsVisited.size / total) * 100);
      printDim("rooms explored: " + roomsVisited.size);
      printDim("depth reached: " + room.depth + " / 6");
      const filled = Math.round(pct / 5);
      printDim('[' + '█'.repeat(filled) + '░'.repeat(20-filled) + '] ' + pct + '%');
      break;
    }

    case ['n','s','e','w','north','south','east','west'].includes(cmd): {
      const dir = cmd[0];
      if (room.exits[dir]) {
        currentRoom = room.exits[dir];
        roomsVisited.add(currentRoom);
        moveCount++;
        describeRoom(currentRoom);
        if (rooms[currentRoom].isCenter) gameOver = true;
      } else {
        printEmpty(); printWarn("the wall is solid.");
      }
      break;
    }

    case cmd === 'listen' && room.isCenter: { triggerWin(); break; }

    case cmd === 'listen': {
      printEmpty(); listenTotal++;

      // dead_2 unlock
      if (currentRoom === 'dead_2') {
        rooms['dead_2'].listenCount = (rooms['dead_2'].listenCount || 0) + 1;
        if (rooms['dead_2'].listenCount >= 3 && !rooms['dead_2'].hiddenUnlocked) {
          rooms['dead_2'].hiddenUnlocked = true;
          rooms['dead_2'].exits.n = 'center';
          printDim("you listen.");
          setTimeout(() => printEmpty(), 1200);
          setTimeout(() => printDim("something listens back."), 2800);
          setTimeout(() => {
            printEmpty(); printBrt("something opens."); printBrt("north.");
            rooms['dead_2'].flavor = "exits: west, north";
          }, 4200);
          break;
        }
      }

      const tuner = [
        ["you hear your own breathing.", "nothing else."],
        ["you hear your own breathing.", "and something. very faint.", "like a note played in another building."],
        ["a hum. low and unsteady.", "you can't quite place it.", "somewhere between feeling and sound."],
        ["clearer now. a single frequency.", "it wavers. like a string still settling.", "you are getting closer to something."],
        ["unmistakable. a held note.", "low. steady. almost felt in the chest.", "you know this sound from somewhere."],
        ["it fills the space here.", "one note. pure. unwavering.", "261.63"],
      ];
      const responses = tuner[Math.min(room.depth, tuner.length - 1)];
      if (room.depth >= 3) {
        printDim(responses[0]);
        setTimeout(() => { printEmpty(); responses.slice(1).forEach(l => printDim(l)); }, 1200);
      } else { responses.forEach(l => printDim(l)); }

      checkUnlocks(); // listening might unlock threshold/hollow
      break;
    }

    case cmd === 'breathe': {
      printEmpty();
      if (room.depth >= 5) {
        printDim("you breathe.");
        setTimeout(() => printEmpty(), 800);
        setTimeout(() => printDim("the note steadies."), 1600);
        nudgeAudio();
      } else if (room.depth >= 3) {
        printDim("you breathe."); printDim("the maze doesn't.");
      } else { printDim("you breathe."); printDim("in. out."); }
      break;
    }

    case cmd === 'hum': {
      humCount++;
      printEmpty(); printDim("you hum.");
      if (room.depth >= 3) { printDim("the maze hums back."); printDim("not an echo. a response."); }
      else { printDim("the sound is swallowed immediately."); }
      checkHumGeometry(); checkUnlocks();
      break;
    }

    case cmd === 'sing': {
      printEmpty();
      const sings = ["the sound you make echoes differently here.",
        "you hold a note. the walls hold it back.",
        "it disappears before you finish.",
        "something almost harmonizes with you."];
      printDim(sings[moveCount % sings.length]);
      break;
    }

    case cmd === 'who are you': {
      printEmpty();
      if (askedQuestions.has('who are you')) printDim("you already asked that.");
      else askedQuestions.add('who are you');
      break;
    }

    case cmd === 'remember': {
      printEmpty(); printDim("something almost returns to you.");
      if (moveCount > 10) {
        setTimeout(() => printEmpty(), 800);
        setTimeout(() => printDim("a room. light through a window. music."), 1600);
        setTimeout(() => printDim("it's gone."), 2800);
      }
      break;
    }

    case cmd === 'dream':  { printEmpty(); printDim("you are already inside one."); break; }
    case cmd === 'name':   { printEmpty(); printDim("261hz."); printDim("that's all you have."); break; }
    case cmd === 'forget': { printEmpty(); printDim("you try."); printDim("the maze doesn't."); break; }
    case cmd === 'wake':   { printEmpty(); printDim("you are awake."); printDim("that's the problem."); break; }

    case cmd === 'play': {
      printEmpty();
      if (room.depth >= 5) { printBrt("not yet."); printBrt("find the note first."); }
      else { printDim("there is nothing to play here."); printDim("keep moving."); }
      break;
    }

    case cmd === 'touch' || cmd === 'feel': {
      printEmpty();
      if (room.dead) { printDim("the wall is cool. slightly damp."); printDim("you press harder. nothing."); }
      else printDim("rough. solid. real.");
      break;
    }

    case cmd === 'wait' || cmd === 'sit' || cmd === 'rest': {
      printEmpty(); printDim("you wait.");
      if (room.depth >= 4) {
        setTimeout(() => printEmpty(), 800);
        setTimeout(() => printDim("somewhere above you: a cursor blinks."), 1600);
      } else printDim("the maze doesn't mind.");
      break;
    }

    case cmd === 'back' || cmd === 'return':
      { printEmpty(); printWarn("you'll have to find your own way back."); break; }
    case cmd === 'quit' || cmd === 'exit' || cmd === 'surface': {
      printEmpty();
      printDim("disconnecting.");
      setTimeout(() => printDim("signal lost."), 900);
      setTimeout(() => printDim("returning to surface."), 1800);
      setTimeout(() => {
        document.body.style.transition = "filter 2.5s ease, opacity 2.5s ease";
        document.body.style.filter = "blur(2px) brightness(0.5)";
        document.body.style.opacity = "0";
      }, 2400);
      setTimeout(() => { window.location.href = PROFILE_URL; }, 4800);
      break;
    }

    case cmd.startsWith('go '): {
      const d = cmd.split(' ')[1];
      if (['north','south','east','west'].includes(d)) { handleCommand(d[0]); return; }
      printEmpty(); printWarn("unknown command. try: help"); break;
    }

    default: {
      printEmpty();
      const u = ["the maze doesn't respond to that.","nothing happens.","silence.",
                 "the walls don't answer.","unknown. try: help"];
      printWarn(u[moveCount % u.length]);
      break;
    }
  }
}

// ============================================================
// EXIT / SURFACE
// ============================================================
function goProfile() {
  // slow dissolve then navigate
  document.body.style.transition = "filter 2.5s ease, opacity 2.5s ease";
  const lines = ["disconnecting.", "signal lost.", "returning to surface."];
  // print to output if visible, else just navigate
  const o = document.getElementById('output');
  if (o) {
    lines.forEach((l, i) => {
      setTimeout(() => {
        const div = document.createElement('div');
        div.className = "line line-dim";
        div.textContent = l;
        o.appendChild(div);
        o.scrollTop = o.scrollHeight;
      }, i * 800);
    });
  }
  setTimeout(() => {
    document.body.style.filter = "blur(2px) brightness(0.5)";
    document.body.style.opacity = "0";
  }, lines.length * 800);
  setTimeout(() => {
    window.location.href = PROFILE_URL;
  }, lines.length * 800 + 2600);
}

// ============================================================
// WIN
// ============================================================
function triggerWin() {
  fadeOutAudio(); clearTimeout(idleTimer);
  document.body.classList.remove('deep');
  setTimeout(() => {
    document.getElementById('win-screen').classList.add('visible');
    ['w1','w2','w3','w4','w5'].forEach((id,i) =>
      setTimeout(() => document.getElementById(id).classList.add('show'), 400+i*750));
    const after = 400 + 4*750 + 750;
    setTimeout(() => document.getElementById('w6').classList.add('show'), after+2800);
    setTimeout(() => document.getElementById('w7').classList.add('show'), after+3700);
    setTimeout(() => document.getElementById('w8').classList.add('show'), after+4900);
    setTimeout(() => document.getElementById('w9').classList.add('show'), after+5600);
  }, 600);
}

// ============================================================
// RESTART
// ============================================================
function restartGame() {
  runCount++; currentRoom = 'entrance';
  moveCount = 0; roomsVisited = new Set(['entrance']);
  gameOver = false; listenTotal = 0; humCount = 0;
  lastDir = null; repeatCount = 0;
  thresholdUnlocked = false; hollowUnlocked = false;
  globalEvents.clear(); clearTimeout(idleTimer);

  const parts = bootVersion.split('.');
  parts[2] = String(parseInt(parts[2]) + 1);
  bootVersion = parts.join('.');

  // reset room state
  Object.values(rooms).forEach(r => {
    r._bridged = false; r._collapsed = false; r._mutated = false;
    if (r.listenCount !== undefined) r.listenCount = 0;
    if (r.hiddenUnlocked !== undefined) {
      r.hiddenUnlocked = false; delete r.exits.n;
      r.flavor = "exit: west";
    }
    if (r.isFalseCenter) r.exits = {};
  });

  // restore exits
  rooms['passage_low'].exits = { n:'threshold', s:'chamber_a' };
  rooms['deep_hall'].exits = { n:'hollow', e:'dead_4', w:'winding' };
  rooms['deep_hall'].impressions = {
    n:"the narrower passage feels familiar.",
    e:"a pocket in the dark.",
    w:"something winds away from you."
  };
  rooms['winding'].exits = { e:'deep_hall', n:'hollow' };
  rooms['loop_b'].exits = { s:'loop_a', e:'passage_wide' };
  rooms['side_room'].exits = { w:'chamber_a', n:'dead_3' };
  rooms['hollow'].exits = { n:'false_center', s:'deep_hall' };
  rooms['false_center'].exits = {};

  document.getElementById('win-screen').classList.remove('visible');
  document.querySelectorAll('.win-line').forEach(el => el.classList.remove('show'));
  document.getElementById('output').innerHTML = '';
  document.body.classList.remove('deep');

  fadeOutAudio(); boot();
}

// ============================================================
// BOOT
// ============================================================
function boot() {
  rooms['hollow'].exits.n = 'false_center';
  rooms['false_center'].exits = {};
  // all paths open from start

  const o = out();
  o.classList.add('flicker');
  setTimeout(() => o.classList.remove('flicker'), 400);

  setTimeout(() => printDim("SYSTEM BOOT v" + bootVersion + "  --  READY"), 200);
  setTimeout(() => printDim("------------------------------------"), 400);
  setTimeout(() => printEmpty(), 600);

  if (runCount === 1) {
    setTimeout(() => printDim("welcome back."), 650);
    setTimeout(() => printEmpty(), 900);
    setTimeout(() => print("you are inside a maze."), 1000);
    setTimeout(() => print("you don't remember arriving."), 1300);
  } else if (runCount === 2) {
    setTimeout(() => printDim("you've done this before."), 650);
    setTimeout(() => printEmpty(), 900);
    setTimeout(() => print("you are inside a maze."), 1000);
    setTimeout(() => print("you don't remember arriving."), 1300);
  } else if (runCount >= 3) {
    setTimeout(() => printDim("you've done this before."), 650);
    setTimeout(() => printEmpty(), 900);
    setTimeout(() => print("you are inside a maze."), 1000);
    setTimeout(() => print("you remember arriving this time."), 1300);
  } else {
    setTimeout(() => print("you are inside a maze."), 800);
    setTimeout(() => print("you don't remember arriving."), 1100);
  }

  const off = runCount > 0 ? 200 : 0;
  setTimeout(() => print("somewhere ahead, a sound."), 1400+off);
  setTimeout(() => printEmpty(), 1700+off);
  setTimeout(() => printDim("type: help for commands"), 1900+off);
  setTimeout(() => {
    describeRoom(currentRoom, true);
    rooms[currentRoom].visited = true;
    roomsVisited.add(currentRoom);
  }, 2300+off);
}

// ============================================================
// INPUT
// ============================================================
document.getElementById('input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const val = this.value; this.value = '';
    handleCommand(val);
  }
});
document.addEventListener('click', () => {
  document.getElementById('input').focus();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
});
document.addEventListener('keydown', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
});

boot();
</script>
